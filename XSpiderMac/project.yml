name: XSpiderMac
targets:
  XSpiderMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - path: Resources
        excludes:
          - "Binaries"
      - path: Resources/Binaries/aria2next
        buildPhase: resources
        attributes:
          - CodeSignOnCopy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: moe.keli.xspider.mac
      INFOPLIST_KEY_CFBundleDisplayName: "X-Spider"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      # 版本号：与 GitHub Release 的 tag 保持一致（1.0.0）
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: YES
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # 内置 aria2Next:保持可执行位,随应用签名
      OTHER_CODE_SIGN_FLAGS: "--deep"
    entitlements:
      path: XSpiderMac.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    scheme:
      testTargets:
        - XSpiderMacTests
  XSpiderMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: moe.keli.xspider.mac.tests
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    dependencies:
      - target: XSpiderMac
