name: macOS Tests

on:
  push:
    branches: [master]
    paths:
      - "XSpiderMac/**"
      - "script/**"
      - ".github/workflows/macos-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "XSpiderMac/**"
      - "script/**"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd XSpiderMac
          xcodegen generate

      # 生产源码零边界泄漏（X 端点 / queryId / features / aria2 RPC 等）
      - name: Boundary guard
        run: bash script/check_boundaries.sh

      # 随包二进制与 components.lock.json 对账
      - name: Verify bundled components
        run: bash script/verify_components.sh

      - name: Run unit tests
        run: |
          cd XSpiderMac
          xcodebuild \
            -project XSpiderMac.xcodeproj \
            -scheme XSpiderMac \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            test
